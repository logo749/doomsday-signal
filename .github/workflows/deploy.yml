name: Deploy to GitHub Pages

# main 根目录 + 两个玩法分支，分别聚合到 _site/variant-* 子路径
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch variant branches
        run: |
          git fetch origin variant/merge-blade:refs/remotes/origin/variant/merge-blade
          git fetch origin variant/backpack-battles:refs/remotes/origin/variant/backpack-battles
      - name: Build multi-variant site
        run: |
          rm -rf _site
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          mkdir -p _site/variant-merge-blade _site/variant-backpack
          git archive origin/variant/merge-blade | tar -x -C _site/variant-merge-blade
          git archive origin/variant/backpack-battles | tar -x -C _site/variant-backpack
          ls -la _site _site/variant-merge-blade _site/variant-backpack
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
